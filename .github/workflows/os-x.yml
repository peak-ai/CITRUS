# Triggered on push and pull request events
on: 
  pull_request:
    branches:
      - main

# Name of the workflow => usethis::use_github_actions_badge("CI-CD")
name: CI-CD Mac OS

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        r-version: ['release']

    steps:
      - uses: actions/checkout@0717577d45739eb3c851188b29f50ed6c0b2194e  # v2.8.0
      - name: Set up R ${{ matrix.r-version }}
        uses: r-lib/actions/setup-r@f5b3dfbf1942ce68283de21bf65cce051e3a2c4d  # v1
        with:
          r-version: ${{ matrix.r-version }}
      
      - uses: r-lib/actions/setup-pandoc@f5b3dfbf1942ce68283de21bf65cce051e3a2c4d  # v1
          
      - name: "Install curl and pandoc for Linux"
        if: runner.os == 'Linux'
        run: |
          sudo apt install libcurl4-openssl-dev
          sudo apt-get install pandoc
          
      - name: Query dependencies
        run: |
          install.packages('remotes')
          saveRDS(remotes::dev_package_deps(dependencies = TRUE), ".github/depends.Rds", version = 2)
          writeLines(sprintf("R-%i.%i", getRversion()$major, getRversion()$minor), ".github/R-version")
        shell: Rscript {0}

      - name: Cache R packages
        uses: actions/cache@2b250bc32ad02700b996b496c14ac8c2840a2991  # v2.1.8
        with:
          path: ${{ env.R_LIBS_USER }}
          key: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-${{ hashFiles('.github/depends.Rds') }}
          restore-keys: ${{ runner.os }}-${{ hashFiles('.github/R-version') }}-1-${{ hashFiles('.github/depends.Rds') }}
        
      - name: Install dependencies
        run: |
          remotes::install_deps(dependencies = TRUE)
          remotes::install_cran("rcmdcheck")
        shell: Rscript {0}

      - name: Check package
        shell: Rscript {0}
        run: rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "error", check_dir = "check")
        
      - name: Unit test workflow
        run: |
          install.packages('devtools')
          devtools::test()
        shell: Rscript {0}
